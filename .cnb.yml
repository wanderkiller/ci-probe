# 推送任意分支触发；只用 1 个 job，8 核，约几核时内结束。
$:
  push:
    - runner:
        tags: cnb:arch:arm64:v8
        cpus: 8
      docker:
        image: ubuntu:24.04
      stages:
        - name: deps
          script: apt-get update -qq && apt-get install -y -qq curl ca-certificates openssl build-essential util-linux procps >/dev/null
        - name: probe
          script: PROBE_COMPILE=1 bash probe.sh
